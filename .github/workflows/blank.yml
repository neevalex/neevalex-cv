name: Deploy CV via SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cv
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload repository to neevalex.com CV folder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy settings
        env:
          SFTP_HOST: ${{ vars.SFTP_HOST }}
          SFTP_PORT: ${{ vars.SFTP_PORT }}
          SFTP_USER: ${{ vars.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR }}
        run: |
          set -euo pipefail

          if [ -z "${SFTP_HOST}" ] || [ -z "${SFTP_USER}" ] || [ -z "${SFTP_PASSWORD}" ]; then
            echo "Missing SFTP deployment configuration. Set vars.SFTP_HOST, vars.SFTP_USER, and secret SFTP_PASSWORD."
            exit 1
          fi

          # Most shared hosting accounts are chrooted; relative path is safer.
          REMOTE_DIR="${REMOTE_DIR:-public_html/cv}"
          SFTP_PORT="${SFTP_PORT:-22}"

          # Allow SFTP_HOST to be either host, host:port, or a URL-like value.
          SFTP_HOST="${SFTP_HOST#sftp://}"
          SFTP_HOST="${SFTP_HOST#ftp://}"
          SFTP_HOST="${SFTP_HOST%%/*}"
          if [[ "${SFTP_HOST}" == *:* ]]; then
            if [ -z "${SFTP_PORT:-}" ] || [ "${SFTP_PORT}" = "22" ]; then
              SFTP_PORT="${SFTP_HOST##*:}"
            fi
            SFTP_HOST="${SFTP_HOST%%:*}"
          fi

          echo "DEPLOY_HOST=${SFTP_HOST}" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=${SFTP_PORT}" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=${SFTP_USER}" >> "$GITHUB_ENV"
          echo "DEPLOY_TARGET=${REMOTE_DIR}" >> "$GITHUB_ENV"

          echo "Deploy target: ${REMOTE_DIR}"
          echo "SFTP endpoint: ${SFTP_HOST}:${SFTP_PORT}"

      - name: Upload files via SCP action
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ env.DEPLOY_PORT }}
          source: "."
          target: ${{ env.DEPLOY_TARGET }}
          strip_components: 0
          overwrite: true
          rm: false
          tar_dereference: true
          tar_tmp_path: /tmp
          exclude: ".git,.github,.gitignore"
