name: Deploy CV via SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cv
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync repository to neevalex.com CV folder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Sync files to remote server
        env:
          SFTP_HOST: ${{ vars.SFTP_HOST }}
          SFTP_USER: ${{ vars.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR }}
        run: |
          set -euo pipefail

          if [ -z "${SFTP_HOST}" ] || [ -z "${SFTP_USER}" ] || [ -z "${SFTP_PASSWORD}" ]; then
            echo "Missing SFTP deployment configuration. Set vars.SFTP_HOST, vars.SFTP_USER, and secret SFTP_PASSWORD."
            exit 1
          fi

          # Most shared hosting SFTP accounts are chrooted, so absolute /home/... paths often fail.
          REMOTE_DIR="${REMOTE_DIR:-public_html/cv}"
          echo "Deploy target: ${REMOTE_DIR}"

          lftp -u "${SFTP_USER},${SFTP_PASSWORD}" "sftp://${SFTP_HOST}" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set net:timeout 30
          pwd
          mkdir -p "${REMOTE_DIR}"
          mirror --reverse --delete --verbose \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .gitignore \
            ./ "${REMOTE_DIR}/"
          bye
          EOF
